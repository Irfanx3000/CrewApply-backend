# Nginx server block for api.crewapply.com — reverse proxy to the CrewApply
# API (Node/Express, run under PM2 as "crewapply-api" on 127.0.0.1:5000).
#
# Install: sudo cp this file to /etc/nginx/sites-available/api.crewapply.com
#          sudo ln -s /etc/nginx/sites-available/api.crewapply.com /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then run: sudo certbot --nginx -d api.crewapply.com
#   (certbot rewrites this file in place to add the SSL server block + a
#   plain-HTTP -> HTTPS redirect — do NOT hand-write the SSL block yourself)

server {
    listen 80;
    listen [::]:80;
    server_name api.crewapply.com;

    # Large-ish body allowance for multipart uploads (resumes, certificates,
    # photos) — Express itself caps JSON bodies at 10kb (see config/body.limit)
    # but multipart file uploads go through multer, not express.json, so this
    # is the real ceiling for file size (matches the largest configured
    # upload.*.maxSizeMb, currently 10MB, with headroom).
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Forward the real client info — app.js's `trust proxy` setting reads
        # these to get req.protocol/req.ip right (rate-limit keying, and
        # upload URLs coming back as https:// not http://).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upgrade headers kept even though this API has no WebSocket routes
        # today — harmless to include, avoids having to remember this later.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
